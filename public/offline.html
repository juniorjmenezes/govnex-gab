<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#2563eb" />
        <title>Sem conexão - Gabnex</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            }
            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                background: Canvas;
                color: CanvasText;
            }
            main {
                width: min(28rem, calc(100% - 2rem));
                text-align: center;
            }
            svg {
                width: 3rem;
                height: 3rem;
                color: #2563eb;
            }
            h1 {
                margin: 1rem 0 0.5rem;
                font-size: 1.5rem;
            }
            p {
                margin: 0;
                opacity: 0.7;
                line-height: 1.5;
            }
            button {
                margin-top: 1.25rem;
                border: 0;
                border-radius: 0.5rem;
                padding: 0.7rem 1rem;
                background: #2563eb;
                color: white;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-width="2" d="M8.5 16.5h-2A4.5 4.5 0 0 1 7 7.53 6 6 0 0 1 18.84 9 3.5 3.5 0 0 1 18 16h-2.5M12 12v8m-3-3 3 3 3-3" />
            </svg>
            <h1>Você está sem conexão</h1>
            <p>
                Por segurança, dados autenticados não ficam armazenados para uso
                offline. Reconecte-se para acessar a agenda e as demandas.
            </p>
            <button type="button" onclick="location.reload()">Tentar novamente</button>
        </main>
    </body>
</html>
