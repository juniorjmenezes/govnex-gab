[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Servidor web.
[program:apache2]
command=apache2-foreground
autostart=true
autorestart=true
priority=10
stopsignal=WINCH
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Despacha lembretes de compromisso, notificações de demanda, resumo diário
; do WhatsApp, expurgo de dados sensíveis e as sincronizações agendadas do
; TSE (ver routes/console.php).
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Exportações de relatório (PDF/XLSX) e demais jobs sem fila explícita.
[program:queue-default]
command=php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Sincronização de dados políticos do TSE e do PollingData (downloads longos;
; tries=1 porque o próprio SincronizacaoTse já registra falha/erro para
; nova tentativa manual pelo admin em vez de retry automático).
; -d memory_limit= redundante com o ini_set() dentro dos próprios jobs
; (ProcessUploadedTseDataset/DownloadAndProcessTseDataset) — este aqui
; funciona porque `queue:work` roda o job direto, sem spawnar subprocesso
; (diferente de `queue:listen`, usado em dev, onde essa flag não chega até
; o worker de verdade). Mantido como reforço; a fonte oficial do valor é
; services.tse.worker_memory_limit. São Paulo sozinho (maior estado) já
; passa de 700MB pra agregar seus candidatos a vereador — medido diretamente.
[program:queue-tse]
command=php -d memory_limit=2048M artisan queue:work --queue=tse --sleep=3 --tries=1 --timeout=7200 --max-time=10800
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=7210
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Envio de mensagens e sincronização de supressão do WhatsApp.
[program:queue-whatsapp]
command=php artisan queue:work --queue=whatsapp --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Coleta de RSS dos portais de notícia (a cada 15 min, um job por fonte).
; tries=1 porque a própria fonte guarda ultimo_erro para o admin ver, e a
; próxima janela de 15 min já é a nova tentativa.
[program:queue-rss]
command=php artisan queue:work --queue=rss --sleep=5 --tries=1 --timeout=120 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=35
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
